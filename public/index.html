<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CF 个人服务台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="logo">
        <span>🛠️</span>
        <span class="logo-text">CF 服务台</span>
      </div>
      <ul class="nav-menu">
        <li><a href="/index.html" class="active">仪表盘</a></li>
        <li><a href="/projects.html">项目管理</a></li>
        <li><a href="/domains.html">域名管理</a></li>
      </ul>
      <div class="user-info">
        <div class="avatar">U</div>
        <div class="user-details">
          <div class="user-name">Personal</div>
          <div class="user-role">Service Console</div>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <header class="page-header">
        <h1>仪表盘</h1>
        <div class="header-actions">
          <a href="/projects.html" class="btn btn-primary">+ 新建项目</a>
        </div>
      </header>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="total-projects">0</div>
          <div class="stat-label">总项目数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="pages-count">0</div>
          <div class="stat-label">Pages</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="workers-count">0</div>
          <div class="stat-label">Workers</div>
        </div>
      </div>

      <section class="section">
        <h2>最近项目</h2>
        <div class="project-grid" id="project-grid">
          <div class="loading">加载中...</div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
